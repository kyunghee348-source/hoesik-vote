<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회식 날짜 투표</title>
  
  <!-- 구글 파이어베이스 SDK 로드 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #1F7A54;
      --bg: #F5F7F6;
      --card-bg: #FFFFFF;
      --border: #E0E0E0;
      --text: #333333;
      --red: #D32F2F;
      --green: #2E7D32;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    header { margin-bottom: 20px; }
    h1 { font-size: 1.8rem; margin: 0 0 10px 0; color: #000; font-weight: 900; }
    p.subtitle { font-size: 0.95rem; color: #666; margin: 0; }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      cursor: pointer;
      font-weight: bold;
      color: #888;
      background: transparent;
      border: none;
      font-size: 1rem;
    }
    .tab.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
    }
    
    .section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }
    .user-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .user-card:hover { border-color: var(--primary); }
    .user-card.active {
      background: #E8F5E9;
      border: 2px solid var(--primary);
    }
    .user-name { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px; }
    .user-status { font-size: 0.8rem; color: #888; }
    
    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 16px;
    }
    .legend-icon {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      font-size: 0.7rem;
    }
    .icon-O { background: var(--green); }
    .icon-X { background: var(--red); }
    .icon-empty { background: transparent; border: 1px dashed #ccc; color: transparent; }

    .month-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .month-title { font-size: 1.2rem; font-weight: bold; }
    .month-actions button {
      background: #F1F3F5;
      border: 1px solid #DEE2E6;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 4px;
    }
    .month-actions button:hover { background: #E9ECEF; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .weekday {
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      padding-bottom: 8px;
    }
    .weekday.sun { color: var(--red); }
    .day-cell {
      aspect-ratio: 1 / 1.1;
      background: #F8F9FA;
      border: 1px solid var(--border);
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .day-cell:hover { background: #E9ECEF; }
    .day-num { position: absolute; top: 6px; font-size: 0.85rem; font-weight: bold; }
    .day-num.sun { color: var(--red); }
    .holiday-name { position: absolute; bottom: 4px; font-size: 0.65rem; color: #888; text-align: center; width: 100%; }
    
    .day-cell.state-O { background: var(--green); border-color: var(--green); color: white; }
    .day-cell.state-O .day-num { color: white; }
    .day-cell.state-O .holiday-name { color: rgba(255,255,255,0.8); }
    .day-cell.state-O::after { content: 'O'; font-size: 1.8rem; font-weight: bold; margin-top: 4px; }
    
    .day-cell.state-X { background: var(--red); border-color: var(--red); color: white; }
    .day-cell.state-X .day-num { color: white; }
    .day-cell.state-X .holiday-name { color: rgba(255,255,255,0.8); }
    .day-cell.state-X::after { content: 'X'; font-size: 1.8rem; font-weight: bold; margin-top: 4px; }

    .result-table-wrapper {
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
    }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; }
    th, td { padding: 10px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #F1F3F5; font-weight: bold; }
    .best-row { background: #E8F5E9; font-weight: bold; }
    .rank-badge { background: var(--green); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem;}

    @media (max-width: 500px) {
      .day-cell::after { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>회식 날짜 투표</h1>
    <p class="subtitle">2026년 10월·11월 중 가능한 날에 O, 안 되는 날에 X를 눌러주세요.</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabBtnVote" onclick="switchTab('vote')">투표하기</button>
    <button class="tab" id="tabBtnResult" onclick="switchTab('result')">종합 결과</button>
  </div>

  <div id="tab-vote">
    <div class="section-title">1. 내 이름 선택</div>
    <div class="user-grid" id="userGrid"></div>

    <div id="calendarArea" style="display: none;">
      <div class="section-title" style="margin-top: 20px;">2. <span id="selectedUserName"></span>님의 가능 여부</div>
      <div class="legend">
        <span class="legend-icon icon-O">O</span> 가능 &nbsp;
        <span class="legend-icon icon-X">X</span> 불가 &nbsp;
        <span class="legend-icon icon-empty"></span> 미정 &nbsp;
        <span style="color:#999; font-size:0.75rem;">(한 번 누를 때마다 O → X → 미정)</span>
      </div>

      <div id="calendars"></div>
    </div>
  </div>

  <div id="tab-result" style="display: none;">
    <div class="section-title">🏆 최다 참석 가능 날짜 순위</div>
    <p style="font-size: 0.85rem; color: #666; margin-bottom: 16px;">실시간으로 합산된 전체 투표 결과입니다.</p>
    <div class="result-table-wrapper">
      <table>
        <thead>
          <tr id="resultHeader">
            <th>순위</th>
            <th>날짜</th>
            <th>가능 인원</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // 이미지에서 발급받은 실제 파이어베이스 연동 키 적용
  const firebaseConfig = {
    apiKey: "AIzaSyAOnnZSiaF26mJigTNqSAGKRKPlNoC7_fo",
    authDomain: "hoesik-vote.firebaseapp.com",
    databaseURL: "https://hoesik-vote-default-rtdb.firebaseio.com",
    projectId: "hoesik-vote",
    storageBucket: "hoesik-vote.firebasestorage.app",
    messagingSenderId: "661828250438",
    appId: "1:661828250438:web:99a32b6ed10930f83b1347",
    measurementId: "G-WRMGM38D8M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const USERS = ['조미화', '이경희', '정준섭', '김명희', '고봉순', '이일호', '공진희'];
  const TOTAL_DAYS = 61;
  let votes = {};
  USERS.forEach(user => { votes[user] = {}; });
  
  let currentUser = null;
  const holidays = { '10-03': '개천절', '10-05': '대체공휴일', '10-09': '한글날' };
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

  function init() {
    renderUserGrid();
    generateCalendars();
    listenToFirebase();
  }

  function listenToFirebase() {
    db.ref('hoesik_votes').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        USERS.forEach(u => {
          votes[u] = data[u] || {};
        });
      }
      renderUserGrid();
      updateCalendarUI();
      if (document.getElementById('tab-result').style.display !== 'none') {
        renderResult();
      }
    });
  }

  function renderUserGrid() {
    const grid = document.getElementById('userGrid');
    grid.innerHTML = '';

    USERS.forEach(user => {
      const userVotes = votes[user] || {};
      const votedCount = Object.keys(userVotes).filter(k => userVotes[k] !== '').length;
      const statusText = votedCount === 0 ? '미투표' : `${votedCount}/${TOTAL_DAYS}일 체크`;
      
      const card = document.createElement('div');
      card.className = `user-card ${currentUser === user ? 'active' : ''}`;
      card.onclick = () => selectUser(user);
      
      card.innerHTML = `
        <div class="user-name">${user}</div>
        <div class="user-status" style="color: ${votedCount > 0 ? 'var(--primary)' : '#888'}">${statusText}</div>
      `;
      grid.appendChild(card);
    });
  }

  function selectUser(user) {
    currentUser = user;
    document.getElementById('calendarArea').style.display = 'block';
    document.getElementById('selectedUserName').innerText = user;
    renderUserGrid();
    updateCalendarUI();
  }

  function generateCalendars() {
    const container = document.getElementById('calendars');
    container.innerHTML = '';
    
    const months = [{ year: 2026, month: 10 }, { year: 2026, month: 11 }];

    months.forEach(m => {
      const monthDiv = document.createElement('div');
      monthDiv.className = 'month-container';
      
      const headerDiv = document.createElement('div');
      headerDiv.className = 'month-header';
      headerDiv.innerHTML = `
        <div class="month-title">${m.year}년 ${m.month}월</div>
        <div class="month-actions">
          <button onclick="setMonthBulk(${m.year}, ${m.month}, 'O')">전부 O</button>
          <button onclick="setMonthBulk(${m.year}, ${m.month}, 'X')">전부 X</button>
          <button onclick="setMonthBulk(${m.year}, ${m.month}, '')">비우기</button>
        </div>
      `;
      monthDiv.appendChild(headerDiv);

      const grid = document.createElement('div');
      grid.className = 'calendar-grid';

      weekdays.forEach((day, idx) => {
        const d = document.createElement('div');
        d.className = `weekday ${idx === 0 ? 'sun' : ''}`;
        d.innerText = day;
        grid.appendChild(d);
      });

      const daysInMonth = new Date(m.year, m.month, 0).getDate();
      const firstDay = new Date(m.year, m.month - 1, 1).getDay();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${m.year}-${String(m.month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const holidayStr = `${String(m.month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const isSun = new Date(m.year, m.month - 1, day).getDay() === 0 || holidays[holidayStr];

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.id = `cell-${dateKey}`;
        cell.onclick = () => toggleVote(dateKey);

        let innerHTML = `<div class="day-num ${isSun ? 'sun' : ''}">${day}</div>`;
        if (holidays[holidayStr]) {
          innerHTML += `<div class="holiday-name ${isSun ? 'sun' : ''}">${holidays[holidayStr]}</div>`;
        }
        cell.innerHTML = innerHTML;
        grid.appendChild(cell);
      }

      monthDiv.appendChild(grid);
      container.appendChild(monthDiv);
    });
  }

  function toggleVote(dateKey) {
    if (!currentUser) return;
    if (!votes[currentUser]) votes[currentUser] = {};
    const current = votes[currentUser][dateKey];
    
    if (current === 'O') votes[currentUser][dateKey] = 'X';
    else if (current === 'X') delete votes[currentUser][dateKey];
    else votes[currentUser][dateKey] = 'O';

    saveToFirebase();
  }

  function setMonthBulk(year, month, value) {
    if (!currentUser) return;
    if (!votes[currentUser]) votes[currentUser] = {};
    const daysInMonth = new Date(year, month, 0).getDate();
    
    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      if (value === '') {
        delete votes[currentUser][dateKey];
      } else {
        votes[currentUser][dateKey] = value;
      }
    }
    saveToFirebase();
  }

  function updateCalendarUI() {
    if (!currentUser) return;
    const userVotes = votes[currentUser] || {};
    
    document.querySelectorAll('.day-cell').forEach(cell => {
      cell.classList.remove('state-O', 'state-X');
      const dateKey = cell.id.replace('cell-', '');
      const status = userVotes[dateKey];
      if (status === 'O') cell.classList.add('state-O');
      if (status === 'X') cell.classList.add('state-X');
    });
  }

  function saveToFirebase() {
    if (!currentUser) return;
    db.ref('hoesik_votes/' + currentUser).set(votes[currentUser] || {});
  }

  function switchTab(tab) {
    document.getElementById('tabBtnVote').classList.remove('active');
    document.getElementById('tabBtnResult').classList.remove('active');
    document.getElementById('tab-vote').style.display = 'none';
    document.getElementById('tab-result').style.display = 'none';

    if (tab === 'vote') {
      document.getElementById('tabBtnVote').classList.add('active');
      document.getElementById('tab-vote').style.display = 'block';
    } else {
      document.getElementById('tabBtnResult').classList.add('active');
      document.getElementById('tab-result').style.display = 'block';
      renderResult();
    }
  }

  function renderResult() {
    const headRow = document.getElementById('resultHeader');
    headRow.innerHTML = '<th>순위</th><th>날짜 (요일)</th><th>가능 인원</th>';
    USERS.forEach(u => { headRow.innerHTML += `<th>${u}</th>`; });

    let allDates = [];
    [10, 11].forEach(month => {
      const days = new Date(2026, month, 0).getDate();
      for(let d=1; d<=days; d++) {
        allDates.push(`${2026}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
      }
    });

    let stats = allDates.map(date => {
      let countO = 0;
      let userVotes = {};
      USERS.forEach(u => {
        const v = (votes[u] && votes[u][date]) ? votes[u][date] : '';
        userVotes[u] = v;
        if (v === 'O') countO++;
      });
      return { date, countO, userVotes };
    });

    stats.sort((a, b) => b.countO - a.countO);

    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';
    
    let rank = 1;
    let prevCount = -1;
    let displayRank = 1;

    stats.forEach((item) => {
      if (item.countO !== prevCount) {
        displayRank = rank;
        prevCount = item.countO;
      }
      rank++;

      const dateObj = new Date(item.date);
      const dayStr = weekdays[dateObj.getDay()];
      const shortDate = `${dateObj.getMonth()+1}/${dateObj.getDate()} (${dayStr})`;
      const isTop = (displayRank === 1 && item.countO > 0);

      const tr = document.createElement('tr');
      if (isTop) tr.className = 'best-row';

      tr.innerHTML = `
        <td>${item.countO > 0 ? (isTop ? `<span class="rank-badge">1위</span>` : `${displayRank}위`) : '-'}</td>
        <td style="font-weight: bold;">${shortDate}</td>
        <td style="color: var(--primary); font-weight: bold;">${item.countO}명 / 7명</td>
      `;

      USERS.forEach(u => {
        const v = item.userVotes[u];
        let color = v === 'O' ? 'var(--green)' : (v === 'X' ? 'var(--red)' : '#ccc');
        let text = v || '-';
        tr.innerHTML += `<td style="color: ${color}; font-weight: ${v ? 'bold':'normal'}">${text}</td>`;
      });
      
      tbody.appendChild(tr);
    });
  }

  init();
</script>
</body>
</html>
